# ADM canonical active state — single state file (v2 alpha).
# Assumption: ONE active writable ADM session per repository at a time.
# Permanent session history lives in evidence/sessions/ (this file is current-only).
schema_version: "2.0"

project:
  id: nirengi-finans
  name: Nirengi — Portföy ve Finansal Okuryazarlık

active:
  phase_id: PHASE-006
  gd_id: GD-002     # status: review — adm-review bekliyor. GD-001 de `review`, kabul onayı bekliyor.

session:            # current open session; cleared by adm-close
  id: null          # S-002 kapandı → evidence/sessions/S-002.md
  runtime: null
  started_at: null
  start_sha: null

blockers: []
# DOCTOR-001 bulguları DR-001..DR-006 hâlâ `open`; hiçbiri critical değil,
# bu yüzden INV-18 gereği blocker listesine girmiyorlar. DR-002/003/004 bu
# taşımayla kapandı sayılabilir (insan onayı gerekir); DR-001 (.gitignore),
# DR-005 (iç içe finans/ klonu) ve DR-006 (kökteki ADM dağıtım dosyaları) açık.

review:
  last_review_id: REVIEW-001
  # REVIEW-001 yalnız GD-001'i kapsar: RV-001/RV-002 resolved (kullanıcı kararı),
  # RV-003/RV-004 (low) open. GD-002'de kod değişti ve review KOŞMADI → pending.
  status: pending   # not-run | pending | clean | findings
