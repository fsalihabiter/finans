# Permanent session history lives in evidence/sessions/ (this file is current-only).
schema_version: "2.0"

project:
  id: nirengi-finans
  name: Nirengi — Portföy ve Finansal Okuryazarlık

active:
  phase_id: PHASE-006
  gd_id: GD-001     # status: review — kabul insan onayı bekliyor; önce adm-review (S-001)

session:            # current open session; cleared by adm-close
  id: null          # S-001 kapandı → evidence/sessions/S-001.md
  runtime: null
  started_at: null
  start_sha: null

blockers: []
